name: Roq Site Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The action's own upload is off so the stylesheet can go into the pages first.
      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          java-version: '25'
          github-pages: 'false'
          site-url: https://greatsouthernsoftware.com.au
      # A page that carries its own stylesheet can be drawn from the first file the
      # browser receives, without a second trip to GitHub.
      - name: Put the stylesheet in the pages
        run: java .github/InlineStyles.java target/roq
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/roq
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
